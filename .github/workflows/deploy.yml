name: Deploy NPC SmartFlow

# Trigger workflow on push to main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Connect to server and run deployment script
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        password: ${{ secrets.SERVER_PASSWORD }}
        timeout: 120s
        command_timeout: 15m
        script: |
          cd /var/www/npc_smartflow
          rm -f public/deploy_debug.log
          {
            echo "=== Deployment Started $(date) ==="
            echo "User: $(whoami)"
            git config --global --add safe.directory /var/www/npc_smartflow
            git fetch origin main --force
            git reset --hard origin/main
            chmod +x deploy.sh
            bash -x deploy.sh
            echo "=== Deployment Finished Successfully ==="
          } > storage/logs/deploy.log 2>&1
          cat storage/logs/deploy.log
