name: Deploy NPC SmartFlow

# Trigger workflow on push to main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Connect to server and run deployment script
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        password: ${{ secrets.SERVER_PASSWORD }}
        timeout: 120s
        command_timeout: 15m
        script: |
          cd /var/www/npc_smartflow
          {
            echo "=== Deployment Started $(date) ==="
            echo "User: $(whoami)"
            git config --global --add safe.directory /var/www/npc_smartflow
            echo "--- Remotes ---"
            git remote -v
            echo "--- Current Status ---"
            git status
            echo "--- Fetching ---"
            git fetch https://github.com/basketballsiit-rgb/npc_smartflow.git main --verbose
            echo "--- Resetting ---"
            git reset --hard FETCH_HEAD
            echo "--- HEAD Commit ---"
            git log -1 --oneline
            echo "--- Run deploy.sh ---"
            chmod +x deploy.sh
            bash -x deploy.sh
            echo "=== Deployment Finished Successfully ==="
          } > public/deploy_debug.log 2>&1
          cat public/deploy_debug.log
