name: Deploy NPC SmartFlow

# Trigger workflow on push to main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Connect to server and run deployment script
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        password: ${{ secrets.SERVER_PASSWORD }}
        timeout: 120s
        command_timeout: 15m
        script: |
          git config --global --add safe.directory /var/www/npc_smartflow
          cd /var/www/npc_smartflow
          git fetch https://github.com/basketballsiit-rgb/npc_smartflow.git main
          git reset --hard FETCH_HEAD
          chmod +x deploy.sh
          bash -x deploy.sh
          echo "✅ Deploy NPC SmartFlow สำเร็จ!"
