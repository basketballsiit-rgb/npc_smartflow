name: Deploy NPC SmartFlow

# Trigger workflow on push to main branch
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Connect to server and run deployment script
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        password: ${{ secrets.SERVER_PASSWORD }}
        script: |
          cd /var/www/npc_smartflow
          git fetch origin main
          git reset --hard origin/main
          chmod +x deploy.sh || true
          ./deploy.sh || (
            /usr/bin/php82 artisan migrate --force || true
            /root/.nvm/versions/node/v20.20.2/bin/npm run build || npm run build || true
            /usr/bin/php82 artisan optimize:clear || true
          )
          echo "✅ Deploy NPC SmartFlow สำเร็จ!"
